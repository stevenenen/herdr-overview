id = "stevenenen.herdr-overview"
name = "Herdr Overview"
version = "0.9.0"
description = "Agents that need you and every open todo, in one live tab."
min_herdr_version = "0.7.4"
platforms = ["macos", "linux"]

[[build]]
command = ["cargo", "build", "--release"]

[[actions]]
id = "open"
title = "Open Overview"
description = "Agents that need you and every open todo"
contexts = ["global", "workspace"]
command = ["./target/release/herdr-overview", "open"]

[[panes]]
id = "overview"
title = "Overview"
placement = "popup"
width = "100%"
height = "100%"
command = ["./target/release/herdr-overview"]

[[events]]
on = "pane.focused"
command = ["./target/release/herdr-overview", "track"]
